<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kansas Nature — Brennan Walter</title>
<meta name="description" content="Kansas nature photography by Brennan Walter">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-nav">
  <a href="index.html" class="name">Brennan Walter</a>
  <nav>
    <button id="sound-toggle" class="sound-toggle" aria-label="Toggle background sound" aria-pressed="false">
      <svg class="icon-muted" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 9v6h4l5 5V4L7 9H3z"/><line x1="16" y1="9" x2="21" y2="15"/><line x1="21" y1="9" x2="16" y2="15"/></svg>
      <svg class="icon-playing" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" style="display:none"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 6a9 9 0 0 1 0 12"/></svg>
    </button>
    <a href="index.html#work">Work</a>
    <a href="index.html#about">About</a>
    <a href="index.html#contact">Contact</a>
  </nav>
</header>

<audio id="bg-audio" loop preload="none">
  <source src="ambient.mp3" type="audio/mpeg">
</audio>

<div class="page-hero">
  <a class="back-link" href="index.html">← Back to all work</a>
  <h1 class="display">Kansas Nature</h1>
  <p>Prairie skies, back roads, and whatever's growing wild along the way — all shot within a short drive of home.</p>
</div>

<section id="work">
  <div class="gallery masonry">
    <div class="frame no-crop reveal">
      <img src="frame-01-dusk.jpg" alt="Sun breaking through storm clouds over a Kansas field">
      <div class="cap"><span class="title">Kansas Sky, Dusk</span><span class="num">01/04</span></div>
    </div>
    <div class="frame no-crop reveal">
      <img src="frame-04-wildflowers.jpg" alt="View through a chain-link fence toward power lines and misty hills">
      <div class="cap"><span class="title">Through the Fence</span><span class="num">02/04</span></div>
    </div>
    <div class="frame no-crop reveal">
      <img src="frame-05-daylily.jpg" alt="Close-up of an orange daylily">
      <div class="cap"><span class="title">Daylily</span><span class="num">03/04</span></div>
    </div>
    <div class="frame no-crop reveal">
      <img src="frame-03-boot.jpg" alt="Close-up of a boot among fallen leaves">
      <div class="cap"><span class="title">First Steps of Spring</span><span class="num">04/04</span></div>
    </div>
  </div>
</section>

<footer>
  <span>&copy; 2026 Brennan Walter</span>
  <span>Kansas</span>
</footer>

<script>
  const revealEls = document.querySelectorAll('.reveal');
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
  }, { threshold: 0.15 });
  revealEls.forEach(el => io.observe(el));
</script>
<script src="audio.js"></script>

</body>
</html>
